name: Update AI Bubble Monitor Data

on:
  schedule:
    # 11:15 UTC, Tue-Sat — after the US market close plus Yahoo Finance's
    # end-of-day settle, covering each Mon-Fri session.
    - cron: "15 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "ai-bubble-data-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch data and compute indicators
        run: node scripts/fetch-ai-bubble-data.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ai-bubble; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/ai-bubble
          git commit -m "chore: update AI bubble monitor data"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows' `push` events (GitHub's anti-recursion safeguard), so the
      # Pages deploy has to be kicked off explicitly here.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
